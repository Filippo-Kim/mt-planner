<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>준비물 계산기 — MT Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="logo">MT Planner</a>
    <nav>
      <a href="index.html">홈</a>
      <a href="plan.html">기획 시작하기</a>
      <a href="checklist.html" class="active">준비물 계산기</a>
      <a href="about.html">소개</a>
    </nav>
  </header>

  <main class="page-content">
    <h1>준비물 계산기</h1>
    <p>인원수를 입력하면 필요한 수량을 자동으로 계산해 드려요.</p>

    <div class="form-row">
      <label for="headcount">참여 인원</label>
      <input type="number" id="headcount" min="1" value="20">
      <button id="calcBtn" class="btn-primary">계산하기</button>
    </div>

    <table class="result-table" id="resultTable" hidden>
      <thead>
        <tr><th>품목</th><th>수량</th></tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </main>

  <footer>
    <p>&copy; 2026 MT Planner</p>
  </footer>

  <script src="js/checklist.js"></script>
</body>
</html>
